name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dev tooling
        run: pip install -r requirements-dev.txt

      - name: gdlint
        run: gdlint scripts/ tests/

      - name: gdformat
        run: gdformat --check scripts/ tests/

      - name: ruff
        run: |
          ruff check tools/
          ruff format --check tools/

      - name: pytest
        run: python -m pytest tools/tests

  import:
    name: Headless import
    needs: lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true

      - uses: ./.github/actions/setup-godot

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Check Godot matches .godot-version
        run: python -m tools.godot_version

      - name: Import project
        run: |
          set -o pipefail
          godot --headless --path . --import 2>&1 | tee import.log
          if grep -E "^(ERROR|SCRIPT ERROR|USER ERROR):" import.log; then
            echo "::error::Godot import reported errors"
            exit 1
          fi

  test:
    name: gdUnit4 tests
    needs: import
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true

      - uses: ./.github/actions/setup-godot

      - name: Import project
        run: godot --headless --path . --import

      - name: Run gdUnit4
        run: ./addons/gdUnit4/runtest.sh --headless --ignoreHeadlessMode -a res://tests

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gdunit4-reports
          path: reports/
          if-no-files-found: warn

  export:
    name: Export builds
    needs: import
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true

      - uses: ./.github/actions/setup-godot

      - name: Read pinned version
        id: pin
        run: echo "version=$(tr -d '[:space:]' < .godot-version)" >> "$GITHUB_OUTPUT"

      - name: Cache export templates
        id: templates
        uses: actions/cache@v6
        with:
          path: ~/.local/share/godot/export_templates
          key: godot-templates-${{ steps.pin.outputs.version }}-win-linux-x86_64

      - name: Download and verify export templates (Windows + Linux x86_64 only)
        if: steps.templates.outputs.cache-hit != 'true'
        env:
          VERSION: ${{ steps.pin.outputs.version }}
        run: |
          set -euo pipefail
          base="https://github.com/godotengine/godot/releases/download/${VERSION}"
          tpz="Godot_v${VERSION}_export_templates.tpz"
          dir="$HOME/.local/share/godot/export_templates/${VERSION/-/.}"
          mkdir -p "$dir" && cd "$RUNNER_TEMP"
          curl -fsSLO "${base}/${tpz}"
          curl -fsSLO "${base}/SHA512-SUMS.txt"
          grep " ${tpz}\$" SHA512-SUMS.txt | sha512sum -c -
          unzip -q -j "${tpz}" \
            templates/linux_release.x86_64 templates/linux_debug.x86_64 \
            templates/windows_release_x86_64.exe templates/windows_debug_x86_64.exe \
            templates/windows_release_x86_64_console.exe templates/windows_debug_x86_64_console.exe \
            templates/version.txt -d "$dir"
          rm -f "${tpz}" SHA512-SUMS.txt

      - name: Import project
        run: godot --headless --path . --import

      - name: Export Windows and Linux
        run: |
          set -euo pipefail
          mkdir -p export/windows export/linux
          godot --headless --path . --export-release "Windows Desktop" export/windows/Trailpaw.exe 2>&1 | tee export.log
          godot --headless --path . --export-release "Linux" export/linux/Trailpaw.x86_64 2>&1 | tee -a export.log
          test -s export/windows/Trailpaw.exe
          test -s export/linux/Trailpaw.x86_64
          if grep -E "^(ERROR|SCRIPT ERROR):" export.log; then
            echo "::error::Export reported errors"
            exit 1
          fi

      - name: Smoke-test the Linux build
        run: |
          set -o pipefail
          timeout 120 ./export/linux/Trailpaw.x86_64 --headless --quit-after 600 2>&1 | tee smoke.log
          if grep -E "^SCRIPT ERROR" smoke.log; then
            echo "::error::The exported build reported script errors"
            exit 1
          fi

      - name: Upload Windows build
        uses: actions/upload-artifact@v7
        with:
          name: trailpaw-windows
          path: export/windows/
          retention-days: 14

      - name: Upload Linux build
        uses: actions/upload-artifact@v7
        with:
          name: trailpaw-linux
          path: export/linux/
          retention-days: 14
